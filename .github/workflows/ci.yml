name: CI

on:
  push:
    branches:
      - ipa
  workflow_dispatch:

jobs:
  build_ipa:
    runs-on: macos-latest
    environment: ipa
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: 'west2-online/fzuhelper-app'
          ref: 'master'
          fetch-depth: 0

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Download EAS CLI
        uses: robinraju/release-downloader@v1
        with:
          repository: linrongda/eas-cli
          latest: true
          tag: local-submit-v1
          fileName: eas-cli_new.tar.gz
          out-file-path: eas-cli_new
          extract: true

      - name: Compute and Inject buildNumber
        run: |
          chmod +x scripts/inject-buildnumber.sh
          ./scripts/inject-buildnumber.sh

      - name: EAS Build iOS
        run: |
          node ./eas-cli_new/packages/eas-cli/bin/run build --platform ios --profile production --non-interactive --local --output=./build/fzuhelper.ipa

      - name: Upload to Github Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./build/fzuhelper.ipa
